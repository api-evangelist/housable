aid: housable
name: Housable
description: >-
  Housable is a California-focused proptech company that helps rental-property owners and operators
  develop Accessory Dwelling Units (ADUs) as a portfolio value-add strategy. Its platform manages ADU
  projects end to end — from concept and financial feasibility analysis through design, permitting,
  bidding, construction, and lease-up — and lets operators run many parallel developments across their
  properties at once, converting underused spaces such as leasing offices, garages, and parking areas
  into new rental units alongside ground-up ADU construction. Housable is an early-stage startup backed
  by Kindred Ventures and other seed investors. It is catalogued in the API Evangelist network as a
  company profile; it does not currently publish a public API, developer portal, or SDKs.
